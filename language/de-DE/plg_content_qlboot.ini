PLG_CONTENT_QLBOOT="Inhalt - qlboot"
PLG_CONTENT_QLBOOT_DESCRIPTION="Teilt einen Beitrag mit dem Bootstrap-5-Raster in Spalten. Tags wie <code>{row}{span6}Lorem ipsum ...{/span}{span6}Lorem ipsum ...{/span}{/row}</code> einfügen. Beispiele:<ul><li>{row}{span6}...{/span}{span6}...{/span}{/row}</li><li>{row}{span4}...{/span}{span8}...{/span}{/row}</li><li>{row}{span4}...{/span}{span4}...{/span}{span4}...{/span}{/row}</li><li>{row}{span3}...{/span}{span3}...{/span}{span6}...{/span}{/row}</li></ul>Die Seite ist in 12 gedachte Spalten geteilt, die Zahlen hinter &quot;span&quot; einer Zeile ergeben daher zusammen 12, z. B. span6 = 6/12 = halbe Breite.<br>Optionale Attribute: <code>{row type=&quot;flex&quot; class=&quot;g-4&quot; id=&quot;&quot; style=&quot;&quot;}</code>, <code>{span6 class=&quot;&quot; id=&quot;&quot; style=&quot;&quot;}</code>."

