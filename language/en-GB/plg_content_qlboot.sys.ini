PLG_CONTENT_QLBOOT="Content - qlboot"
PLG_CONTENT_QLBOOT_DESCRIPTION="Divide an article into columns using the Bootstrap 5 grid. Add tags like <code>{row}{span6}Lorem ipsum ...{/span}{span6}Lorem ipsum ...{/span}{/row}</code>. Examples:<ul><li>{row}{span6}...{/span}{span6}...{/span}{/row}</li><li>{row}{span4}...{/span}{span8}...{/span}{/row}</li><li>{row}{span4}...{/span}{span4}...{/span}{span4}...{/span}{/row}</li><li>{row}{span3}...{/span}{span3}...{/span}{span6}...{/span}{/row}</li></ul>The page is divided into 12 imaginary columns, so the numbers behind &quot;span&quot; of one row should add up to 12, e.g. span6 = 6/12 = half the width.<br>Optional attributes: <code>{row type=&quot;flex&quot; class=&quot;g-4&quot; id=&quot;&quot; style=&quot;&quot;}</code>, <code>{span6 class=&quot;&quot; id=&quot;&quot; style=&quot;&quot;}</code>."
